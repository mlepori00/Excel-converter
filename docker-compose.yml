services:
  app:
    build:
      context: .
      args:
        # Optional: bake the API base URL into the frontend build.
        # Leave empty when the backend serves the frontend on the same origin.
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Production mode: a missing SECRET_KEY fails fast at app startup (see config.py).
      APP_ENV: production
      # Signs login JWTs – fail at compose-start if not provided (no silent fallback).
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
    volumes:
      # Persist the SQLite database (and future blobs) across redeploys.
      - offerten-data:/app/data
    restart: unless-stopped
    # Resource caps (host has 2 vCPU / 4 GB). Defense-in-depth on top of the
    # in-app upload/cell limits: a runaway parse or the Camoufox browser can't
    # OOM the whole host. Leaves ~1 GB for the OS. Tune if the host is resized.
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 512

volumes:
  offerten-data:
