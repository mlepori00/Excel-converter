services:
  app:
    build:
      context: .
      args:
        # Optional: bake the API base URL into the frontend build.
        # Leave empty when the backend serves the frontend on the same origin.
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Production mode: a missing SECRET_KEY fails fast at app startup (see config.py).
      APP_ENV: production
      # Signs login JWTs – fail at compose-start if not provided (no silent fallback).
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
    volumes:
      # Persist the SQLite database (and future blobs) across redeploys.
      - offerten-data:/app/data
    restart: unless-stopped

volumes:
  offerten-data:
